<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina — Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
  <style>
    .admin-badge {
      display: inline-block;
      background: #ff4040;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .dash-stat-card .admin-badge {
      margin-top: 6px;
    }
    .dash-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .dash-table th {
      text-align: left;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 400;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .dash-table td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }
    .dash-table tr:hover td {
      background: rgba(255,255,255,0.02);
    }
    .dash-table .btn-mini {
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      font-size: 0.75rem;
      transition: all .2s;
    }
    .dash-table .btn-mini:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.3);
    }
    .dash-table .btn-danger:hover {
      border-color: #ff4040;
      color: #ff4040;
    }
    .role-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .role-badge.admin { background: #ff4040; color: #fff; }
    .role-badge.artist { background: #4ade80; color: #000; }
    .role-badge.student { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
    .dash-pagination {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 24px;
    }
    .dash-pagination button {
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: rgba(255,255,255,0.6);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .dash-pagination button:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
    .dash-pagination button.active { background: rgba(255,255,255,0.1); color: #fff; }
    .admin-search {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .admin-search input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
    }
    .admin-search input:focus { outline: none; border-color: rgba(255,255,255,0.3); }
    .admin-search select {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo" style="text-decoration:none">Lumina</a>
    <ul class="nav-links">
      <li><a href="/">Inicio</a></li>
      <li><a href="#" class="active">Admin</a></li>
      <li><a href="#" id="nav-auth-admin">Cerrar sesión</a></li>
    </ul>
  </nav>

  <main class="dash">
    <header class="dash-header">
      <div class="dash-header-left">
        <h1>Panel de Administración</h1>
        <p id="admin-greeting">Bienvenido</p>
      </div>
    </header>

    <!-- STATS -->
    <section class="dash-stats" id="admin-stats">
      <div class="dash-stat-card">
        <span class="dash-stat-number" id="stat-users">—</span>
        <span class="dash-stat-label">Usuarios</span>
      </div>
      <div class="dash-stat-card">
        <span class="dash-stat-number" id="stat-artworks">—</span>
        <span class="dash-stat-label">Obras</span>
      </div>
      <div class="dash-stat-card">
        <span class="dash-stat-number" id="stat-mentorships">—</span>
        <span class="dash-stat-label">Mentorías</span>
      </div>
      <div class="dash-stat-card">
        <span class="dash-stat-number" id="stat-bookings">—</span>
        <span class="dash-stat-label">Reservas</span>
      </div>
    </section>

    <!-- TABS -->
    <div class="dash-tabs">
      <button class="dash-tab active" data-tab="users">Usuarios</button>
      <button class="dash-tab" data-tab="artworks">Obras</button>
      <button class="dash-tab" data-tab="mentorships">Mentorías</button>
      <button class="dash-tab" data-tab="bookings">Reservas</button>
    </div>

    <!-- TAB: USERS -->
    <section class="dash-panel active" id="panel-users">
      <div class="admin-search">
        <input type="text" id="user-search" placeholder="Buscar por nombre o email...">
        <select id="user-role-filter">
          <option value="">Todos los roles</option>
          <option value="admin">Admin</option>
          <option value="artist">Artista</option>
          <option value="student">Estudiante</option>
        </select>
        <button class="dash-btn-secondary" id="btn-search-users">Buscar</button>
      </div>
      <div id="users-table-container"><p class="dash-empty">Cargando...</p></div>
    </section>

    <!-- TAB: ARTWORKS -->
    <section class="dash-panel" id="panel-artworks">
      <div id="artworks-table-container"><p class="dash-empty">Cargando...</p></div>
    </section>

    <!-- TAB: MENTORSHIPS -->
    <section class="dash-panel" id="panel-mentorships">
      <div id="mentorships-table-container"><p class="dash-empty">Cargando...</p></div>
    </section>

    <!-- TAB: BOOKINGS -->
    <section class="dash-panel" id="panel-bookings">
      <div id="bookings-table-container"><p class="dash-empty">Cargando...</p></div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
